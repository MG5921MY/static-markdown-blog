<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>加载中...</title>
  <meta name="description" content="" />
  <meta property="og:type" content="article" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="" />
  <meta property="og:site_name" content="" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="" />
  <meta name="twitter:description" content="" />
  <meta name="color-scheme" content="light dark" />
  <meta name="blog-base" content="auto" />
  <link rel="preconnect" href="./" />
  <link rel="preload" as="fetch" href="./site-config.json" crossorigin />
  <link rel="preload" as="fetch" href="./content-index.json" crossorigin />
  <link id="blog-theme" rel="stylesheet" href="./themes/graphite/theme.css" />
</head>
<body>
  <nav class="nav">
    <a href="./index.html" class="nav-brand">
      <div class="nav-logo"></div>
      <span id="nav-site-name">加载中...</span>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="./index.html" class="nav-link" data-i18n="nav.home">首页</a>
    </div>
  </nav>

  <main class="main">
    <div class="container">
      <div id="post-loading" class="loading-state" style="padding: 100px 0;">
        <div class="loading-spinner"></div>
        <p data-i18n="post.loading">正在加载文章...</p>
      </div>

      <article id="post-content" class="post-article" style="display: none;">
        <header class="post-header">
          <nav class="breadcrumbs" aria-label="breadcrumb">
            <a href="./index.html" class="breadcrumb-link" data-i18n="nav.home">首页</a>
            <span class="breadcrumb-sep">/</span>
            <a class="breadcrumb-link" id="post-breadcrumb-category" href="#"></a>
            <span class="breadcrumb-sep">/</span>
            <span class="breadcrumb-current" id="post-breadcrumb-title"></span>
          </nav>
          <div class="post-meta">
            <span class="post-category" id="post-category"></span>
            <span class="post-date" id="post-date"></span>
            <span class="post-reading-time" id="post-reading-time"></span>
          </div>
          <h1 class="post-title" id="post-title"></h1>
          <div class="post-actions">
            <div class="post-tags" id="post-tags"></div>
            <button type="button" class="page-btn post-share-btn" id="post-share-btn" data-i18n="post.copyLink">复制链接</button>
          </div>
        </header>
        <div class="post-body markdown-body" id="post-body"></div>
        <section class="related-posts" id="related-posts" style="display: none;">
          <h2 class="related-title" data-i18n="post.related">相关文章</h2>
          <ul class="related-list" id="related-list"></ul>
        </section>
        <nav class="post-nav" id="post-nav" style="display: none;">
          <a class="post-nav-link post-nav-prev" id="post-nav-prev" href="#">
            <span class="post-nav-label" data-i18n="ui.prevPost">上一篇</span>
            <span class="post-nav-title" id="post-nav-prev-title"></span>
          </a>
          <a class="post-nav-link post-nav-next" id="post-nav-next" href="#">
            <span class="post-nav-label" data-i18n="ui.nextPost">下一篇</span>
            <span class="post-nav-title" id="post-nav-next-title"></span>
          </a>
        </nav>
      </article>

      <div id="comments" class="comments-section" style="display: none;"></div>

      <div id="post-error" class="error-state" style="display: none; padding: 100px 0;">
        <h2 data-i18n="post.notFound">文章未找到</h2>
        <p id="error-detail" data-i18n="post.notFoundDetail">你访问的文章不存在，或者已经被移动。</p>
        <a href="./index.html" class="btn btn-primary" style="margin-top: 20px;" data-i18n="post.backHome">返回首页</a>
      </div>
    </div>

    <footer class="footer" data-template="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-links" id="footer-links">
            <a href="./index.html" class="footer-link" data-i18n="nav.home">首页</a>
          </div>
          <div class="footer-info" id="beian-footer"></div>
        </div>
      </div>
    </footer>
  </main>

  <script src="./client/i18n.js"></script>
  <script src="./client/core.js"></script>
  <script src="./client/nav.js"></script>
  <script src="./client/render.js"></script>
  <script src="./client/ui.js"></script>
  <script src="./client/blog.js"></script>
  <script src="./client/auth.js"></script>
  <script>
    (async function() {
      const loadingEl = document.getElementById('post-loading');
      const contentEl = document.getElementById('post-content');
      const errorEl = document.getElementById('post-error');
      const errorDetail = document.getElementById('error-detail');

      const postId = Blog.getUrlParam('id');
      if (!postId) {
        Blog.showPageError(loadingEl, errorEl, errorDetail, Blog.t('post.missingParam'));
        return;
      }

      await Blog.runPage({
        needIndex: true,
        needPathMap: true,
        loadingEl,
        errorEl,
        errorDetailEl: errorDetail,
        task: async () => {
          // Load DOMPurify (required for sanitization), hljs in background
          await Blog.loadMarkdownDeps();
          await Blog.loadHighlightDeps();

          // 加载并渲染文章；加密文章未解锁时 loadPostContent 返回空内容，
          // 此时显示解锁提示，并在解锁成功后自动重新加载
          const renderPost = async () => {
            const post = await Blog.loadPostContent(postId);
            const isEncrypted = !!(Blog.pathMap && Blog.pathMap[postId] && Blog.pathMap[postId].encrypted === true);

            if (!post.content && isEncrypted) {
              const lockedHint = (() => {
                const t = Blog.t ? Blog.t('post.lockedHint') : '';
                return t && t !== 'post.lockedHint' ? t : '文章已加密，请输入密码后查看。';
              })();
              loadingEl.innerHTML = `<div class="empty-state"><p>${lockedHint}</p></div>`;
              if (window.BlogAuth && typeof BlogAuth.onUnlocked === 'function') {
                BlogAuth.onUnlocked(() => {
                  loadingEl.innerHTML = '<div class="loading-spinner"></div>';
                  renderPost();
                });
              }
              return;
            }

          document.title = `${post.title} | ${Blog.config?.site?.name || Blog.t('site.defaultName')}`;
          document.getElementById('nav-site-name').textContent = Blog.config?.site?.name || Blog.t('site.defaultName');

          // 面包屑：首页 / 分类（链接到分类页）/ 标题
          const breadcrumbCategory = document.getElementById('post-breadcrumb-category');
          if (breadcrumbCategory) {
            breadcrumbCategory.textContent = `${post.categoryIcon || ''} ${post.categoryName || ''}`.trim();
            breadcrumbCategory.href = Blog.resolvePageUrl('category.html', { id: post.category || '' });
          }
          const breadcrumbTitle = document.getElementById('post-breadcrumb-title');
          if (breadcrumbTitle) breadcrumbTitle.textContent = post.title;

          document.getElementById('post-category').textContent = `${post.categoryIcon || ''} ${post.categoryName}`;
          document.getElementById('post-date').textContent = Blog.formatDate(post.date);
          document.getElementById('post-title').textContent = post.title;
          // 标签链接化：与首页卡片一致，点击跳转首页 ?tag= 筛选
          document.getElementById('post-tags').innerHTML = (post.tags || []).map((tag) =>
            `<a class="post-tag" href="${Blog.escapeHtml(Blog.resolvePageUrl('index.html', { tag }))}">${Blog.escapeHtml(tag)}</a>`
          ).join('');

          if (post.rendered) {
            const safe = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(post.content) : post.content;
            document.getElementById('post-body').innerHTML = safe;
          } else {
            document.getElementById('post-body').innerHTML = Blog.renderMarkdown(post.content);
          }

          // 将预渲染的 mermaid 代码块转换为占位符（构建时没有 mermaid）
          window._mermaidBlocks = window._mermaidBlocks || [];
          document.querySelectorAll('#post-body pre > code.language-mermaid').forEach((el) => {
            const code = el.textContent || '';
            const idx = window._mermaidBlocks.length;
            window._mermaidBlocks.push(code);
            const placeholder = document.createElement('div');
            placeholder.className = 'mermaid-placeholder';
            placeholder.setAttribute('data-mermaid-id', idx);
            el.parentElement.replaceWith(placeholder);
          });

          // 对预渲染的代码块应用 hljs 高亮（构建时没有 hljs）
          if (typeof hljs !== 'undefined') {
            document.querySelectorAll('#post-body pre > code').forEach((el) => {
              if (!el.classList.contains('hljs') && !el.classList.contains('language-mermaid')) {
                try { hljs.highlightElement(el); } catch (_) {}
              }
            });
          }

          // 触发 mermaid 渲染
          if (typeof Blog._scheduleMermaidRender === 'function') {
            Blog._scheduleMermaidRender();
          } else if (typeof Blog._renderMermaid === 'function') {
            Blog._renderMermaid();
          }

          Blog.addLineNumbers(document.getElementById('post-body'));
          Blog.generateTOC();

          // 阅读时长（可通过 features.readingTime 关闭或调整速度）
          const readingCfg = Blog.config?.features?.readingTime || {};
          const readingEl = document.getElementById('post-reading-time');
          if (readingEl && readingCfg.enabled !== false) {
            const speed = Number(readingCfg.speed) > 0 ? Number(readingCfg.speed) : 400;
            const minutes = Blog.estimateReadingMinutes(document.getElementById('post-body'), speed);
            readingEl.textContent = Blog.t('post.readingTime').replace('{count}', String(minutes));
          }

          // 分享：优先系统分享（移动端），失败/不可用回退复制链接；
          // 用户在系统分享面板主动取消（AbortError）时不做任何事。
          const shareBtn = document.getElementById('post-share-btn');
          if (shareBtn) {
            shareBtn.addEventListener('click', async () => {
              const shareUrl = window.location.href;
              const flashCopied = () => {
                const original = shareBtn.textContent;
                shareBtn.textContent = Blog.t('post.linkCopied');
                setTimeout(() => { shareBtn.textContent = original; }, 2000);
              };
              if (navigator.share) {
                try {
                  await navigator.share({ title: post.title, url: shareUrl });
                  return;
                } catch (err) {
                  if (err && err.name === 'AbortError') return; // 用户取消
                  // 其他错误（环境不支持/权限）：继续走复制回退
                }
              }
              try {
                await navigator.clipboard.writeText(shareUrl);
                flashCopied();
              } catch (_) { /* 复制不可用：静默（用户仍可手动复制地址栏） */ }
            });
          }

          // 相关文章（构建期预计算：pathMap[id].related）
          const relatedEl = document.getElementById('related-posts');
          const relatedList = document.getElementById('related-list');
          const related = (Blog.pathMap && Blog.pathMap[postId] && Blog.pathMap[postId].related) || [];
          if (relatedEl && relatedList && related.length > 0) {
            relatedList.innerHTML = related.map((item) => `<li class="related-item">
              <a class="related-link" href="${Blog.escapeHtml(Blog.resolvePageUrl('post.html', { id: item.id }))}">${Blog.escapeHtml(item.title)}</a>
            </li>`).join('');
            relatedEl.style.display = 'block';
          }

          // Prev/Next navigation
          const navEl = document.getElementById('post-nav');
          if (post.prev || post.next) {
            const prevEl = document.getElementById('post-nav-prev');
            const nextEl = document.getElementById('post-nav-next');
            if (post.prev) {
              prevEl.href = Blog.resolvePageUrl('post.html', { id: post.prev.id });
              document.getElementById('post-nav-prev-title').textContent = post.prev.title;
            } else {
              prevEl.style.visibility = 'hidden';
            }
            if (post.next) {
              nextEl.href = Blog.resolvePageUrl('post.html', { id: post.next.id });
              document.getElementById('post-nav-next-title').textContent = post.next.title;
            } else {
              nextEl.style.visibility = 'hidden';
            }
            navEl.style.display = 'flex';
          }

          // Comments
          Blog.loadComments();

          loadingEl.style.display = 'none';
          contentEl.style.display = 'block';
          };

          await renderPost();
        }
      });
    })();
  </script>
</body>
</html>
