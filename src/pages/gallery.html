<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>资源</title>
  <meta name="description" content="浏览图片、视频与音频资源。" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:url" content="" />
  <meta property="og:site_name" content="" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="" />
  <meta name="twitter:description" content="" />
  <meta name="color-scheme" content="light dark" />
  <meta name="blog-base" content="auto" />
  <link rel="preconnect" href="./" />
  <link rel="preload" as="fetch" href="./site-config.json" crossorigin />
  <link id="blog-theme" rel="stylesheet" href="./themes/graphite/theme.css" />
</head>
<body>
  <nav class="nav">
    <a href="./index.html" class="nav-brand">
      <div class="nav-logo"></div>
      <span id="nav-site-name">加载中...</span>
    </a>
    <div class="nav-links" id="nav-links"></div>
  </nav>

  <main class="main">
    <section class="hero hero-compact gallery-shell">
      <div class="hero-kicker" data-i18n="gallery.kicker">Resources</div>
      <h1 class="hero-title" data-i18n="gallery.title">资源</h1>
      <p class="hero-subtitle" data-i18n="gallery.description">浏览图片、视频与音频资源。</p>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="gallery-shell">
        <div class="gallery-shell-header">
          <div>
            <h2 class="section-title" data-i18n="gallery.visualAssets">视觉资产</h2>
            <p class="gallery-copy" data-i18n="gallery.galleryCopy">图片、视频与音频资源按分组展示。</p>
          </div>
        </div>

        <div id="gallery-content">
          <div class="loading-state" style="padding: 60px 0;">
            <div class="loading-spinner"></div>
            <p data-i18n="gallery.loading">正在加载资源...</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer" data-template="footer">
      <div class="container">
        <div class="footer-content">
          <div class="footer-links" id="footer-links"></div>
          <div class="footer-info" id="beian-footer"></div>
        </div>
      </div>
    </footer>
  </main>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-stage">
      <button class="lightbox-close" id="lightbox-close-btn" type="button" aria-label="关闭" data-i18n-aria-label="gallery.close">×</button>
      <button class="lightbox-nav prev" id="lightbox-prev-btn" type="button" aria-label="上一项" data-i18n-aria-label="gallery.previous">‹</button>
      <div class="lightbox-media" id="lightbox-media"></div>
      <button class="lightbox-nav next" id="lightbox-next-btn" type="button" aria-label="下一项" data-i18n-aria-label="gallery.next">›</button>
      <button class="lightbox-zoom" id="lightbox-zoom-btn" type="button" aria-label="查看原始尺寸" data-i18n-aria-label="gallery.zoomActual" hidden>1:1</button>
    </div>
    <div class="lightbox-bar">
      <div class="lightbox-filename" id="lightbox-filename"></div>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>
  </div>

  <!-- 音频播放条（全局单例，底部固定；播放状态独立于浏览操作） -->
  <div class="audio-bar" id="audio-bar" hidden>
    <div class="audio-bar-inner">
      <button class="audio-bar-btn" id="audio-prev-btn" type="button" aria-label="上一首" data-i18n-aria-label="gallery.audioPrev">⏮</button>
      <button class="audio-bar-btn audio-bar-play" id="audio-play-btn" type="button" aria-label="播放" data-i18n-aria-label="gallery.audioPlay">▶</button>
      <button class="audio-bar-btn" id="audio-next-btn" type="button" aria-label="下一首" data-i18n-aria-label="gallery.audioNext">⏭</button>
      <div class="audio-bar-info">
        <div class="audio-bar-name" id="audio-bar-name"></div>
        <div class="audio-bar-time" id="audio-bar-time">0:00 / 0:00</div>
      </div>
      <input type="range" class="audio-bar-progress" id="audio-progress" min="0" max="1000" value="0" step="1" aria-label="播放进度" data-i18n-aria-label="gallery.audioProgress" />
      <button class="audio-bar-btn audio-bar-close" id="audio-close-btn" type="button" aria-label="关闭播放条" data-i18n-aria-label="gallery.audioClose">×</button>
    </div>
    <audio id="audio-element" preload="metadata"></audio>
  </div>

  <script src="./client/i18n.js"></script>
  <script src="./client/core.js"></script>
  <script src="./client/nav.js"></script>
  <script src="./client/render.js"></script>
  <script src="./client/ui.js"></script>
  <script src="./client/blog.js"></script>
  <script src="./client/auth.js"></script>
  <script src="./gallery.page.js"></script>
</body>
</html>
